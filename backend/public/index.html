<!doctype html><html><head><meta charset="utf-8"><title>Arham Incentives Portal</title><style>body{font:14px system-ui;margin:2rem;color:#172033}button,select,input{padding:.45rem;margin-right:.4rem}table{border-collapse:collapse;width:100%;margin-top:1rem}th,td{padding:.45rem;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}</style></head><body>
<h1>Arham Incentives Portal</h1><p id="status">Serving the last complete BSE snapshot.</p>
<nav><button data-view="clients">Clients</button><button data-view="trades">Trades</button><button data-view="my-clients">My Clients</button><button data-view="employees">Employees</button><button data-view="incentives">Incentives</button><button id="sync">Sync BSE</button></nav>
<p><label>Employee <select id="employee"></select></label></p><section id="filters" class="hidden"><input id="clientId" placeholder="Client ID"><input id="from" type="date"><input id="to" type="date"><button id="apply">Apply filters</button></section><main></main>
<script src="/socket.io/socket.io.js"></script><script>
const api=async(path)=>{const r=await fetch('/api'+path);if(!r.ok)throw Error('Request failed');return (await r.json()).data};let view='clients';const main=document.querySelector('main'),employee=document.querySelector('#employee'),filters=document.querySelector('#filters');
const money=n=>'₹'+Number(n||0).toFixed(2);function table(rows){if(!rows.length){main.textContent='No cached data yet. Start a BSE sync.';return}const keys=Object.keys(rows[0]);main.innerHTML='<table><thead><tr>'+keys.map(k=>'<th>'+k.replaceAll('_',' ')+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+((k==='brokerage'||k==='incentive')?money(r[k]):r[k]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function load(){filters.classList.toggle('hidden',view!=='trades');try{let p='/'+view;if(view==='my-clients')p='/employees/'+employee.value+'/clients';if(view==='trades'){const q=new URLSearchParams();['clientId','from','to'].forEach(id=>{if(document.querySelector('#'+id).value)q.set(id,document.querySelector('#'+id).value)});p+='?'+q}if(view==='incentives')p+='?employeeId='+employee.value;table(await api(p));document.querySelector('#status').textContent='Serving cached data — updated '+new Date().toLocaleTimeString()}catch(e){main.textContent='Cached data is temporarily unavailable.'}}
async function init(){const es=await api('/employees');employee.innerHTML=es.map(e=>'<option value="'+e.id+'">'+e.name+' ('+e.role+')</option>').join('');load()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;load()});employee.onchange=load;document.querySelector('#apply').onclick=load;document.querySelector('#sync').onclick=async()=>{await fetch('/api/sync',{method:'POST'});document.querySelector('#status').textContent='BSE sync is running; current data remains available.'};io().on('data:updated',load);init();
</script></body></html>
